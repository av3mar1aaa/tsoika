# /etc/nginx/sites-available/tsoika
# Блок с HTTPS дописывает certbot — сначала поднимите только :80 и выполните
#   certbot --nginx -d tsoika.ru -d www.tsoika.ru

upstream tsoika_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tsoika.ru www.tsoika.ru;

    # Загрузка видео из админки и из Telegram-вебхука.
    client_max_body_size 200m;
    client_body_timeout 300s;

    # Телеграм-вебхук и загрузки бывают долгими.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика Next.js с хешем в имени — кешируем навсегда.
    location /_next/static/ {
        proxy_pass http://tsoika_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://tsoika_app;
    }
}
